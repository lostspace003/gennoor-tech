          <div>

def prune_old_tool_outputs(messages: list, keep_recent_turns: int = 4) -> list:
    """Q35: Summarize/prune older tool outputs while preserving active task state."""
    if len(messages) <= keep_recent_turns:
        return messages
    pruned = []
    for idx, msg in enumerate(messages[:-keep_recent_turns]):
        if msg.get("role") == "user" and isinstance(msg.get("content"), list):
            # Compress older tool_result payloads into a concise summary
            pruned.append({
                "role": "user",
                "content": [{"type": "text", "text": "[Summarized prior tool output: step completed]"}]
            })
        else:
            pruned.append(msg)
    return pruned + messages[-keep_recent_turns:]

def validate_tool_args(tool_name: str, tool_input: dict, allowed_schemas: dict) -> bool:
    """Q47: Validate tool_use arguments against schema before dispatching."""
    schema_keys = allowed_schemas.get(tool_name, set())
    return set(tool_input.keys()).issubset(schema_keys)

from dataclasses import dataclass

@dataclass
class ExecutionContext:
    correlation_id: str
    tenant_id: str
    user_oauth_token: str
    model_version: str
    task_id: str
    step_index: int

class EnterpriseMCPGateway:
    def __init__(self, secret_store, policy_engine, audit_logger):
        self.secret_store = secret_store
        self.policy_engine = policy_engine
        self.audit_logger = audit_logger

    async def dispatch_tool(self, ctx: ExecutionContext, tool_use_block: dict) -> dict:
        tool_name = tool_use_block["name"]
        tool_input = tool_use_block["input"]
        tool_call_id = tool_use_block["id"]

        # 1. Validate arguments against registered JSON Schema before dispatch
        if not self.policy_engine.validate_schema(tool_name, tool_input):
            return {"is_error": True, "content": "SchemaValidationError: Invalid tool arguments"}

        # 2. Deterministic PreToolUse Policy-as-Code Gate (blocks destructive/unauthorized ops)
        decision = self.policy_engine.evaluate_pre_tool_hook(
            user_token=ctx.user_oauth_token,
            tenant_id=ctx.tenant_id,
            tool_name=tool_name,
            tool_input=tool_input
        )
        if not decision.allowed:
            if decision.requires_human_approval:
                return {"status": "PENDING_HITL_APPROVAL", "approval_Queue_id": decision.queue_id}
            return {"is_error": True, "content": f"PolicyDenied: {decision.reason}"}

        # 3. Deterministic Idempotency Key for safe checkpoint replay
        idem_raw = f"{ctx.tenant_id}:{ctx.task_id}:{ctx.step_index}:{tool_call_id}"
        idempotency_key = hashlib.sha256(idem_raw.encode()).hexdigest()

        # 4. Exchange user token for least-privilege scoped downstream OAuth token (never in prompt!)
        scoped_token = await self.secret_store.exchange_obo_token(ctx.user_oauth_token, scope=tool_name)

        # 5. Execute & emit structured audit log with correlation_id, actor, and model_version
        result = await self._invoke_downstream(tool_name, tool_input, scoped_token, idempotency_key)
        self.audit_logger.record(
            correlation_id=ctx.correlation_id,
            actor_id=decision.actor_id,
            tenant_id=ctx.tenant_id,
            model_version=ctx.model_version,
            tool_name=tool_name,
            idempotency_key=idempotency_key,
            status="SUCCESS"
        )
        return result`

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchSection(secId) {
      currentSection = secId;
      updateSectionTabs();
      renderActiveSection();
    }

    /*************************************************************************
     * RENDER DRAWER & TOP NAVIGATION
     *************************************************************************/
    function renderDrawerTracks() {
      const container = document.getElementById("drawerTrackList");
      const subtitle = document.getElementById("activeTrackSubtitle");
      const activeTrack = EXAM_DATA[currentTrackId];
      subtitle.textContent = `${activeTrack.title} • ${activeTrack.badge}`;

      container.innerHTML = Object.values(EXAM_DATA).map(track => {
        const isSelected = track.id === currentTrackId;
        const trackScore = getTrackScore(track.id);
        return `
          <button onclick="switchTrack('${track.id}')"
            class="w-full text-left p-3.5 rounded-xl border transition-all flex items-start gap-3.5 ${
              isSelected
                ? 'bg-claude-500/10 border-claude-500 text-slate-900 dark:text-white shadow-sm'
                : 'bg-stone-50/70 dark:bg-slate-800/40 border-stone-200 dark:border-slate-800 hover:border-claude-400/50 text-slate-600 dark:text-slate-300'
            }">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 font-bold text-sm ${
              isSelected ? 'bg-claude-500 text-white' : 'bg-stone-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300'

              <div class="flex items-center justify-between gap-2">
                <span class="text-[11px] font-mono uppercase tracking-wider text-claude-500 font-semibold">Track ${track.number}</span>
                <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-stone-200/80 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                  ${trackScore.correct}/${trackScore.total} Qs
                </span>
              </div>
              <h3 class="font-bold text-sm mt-0.5 truncate">${track.title}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${track.badge}</p>
            </div>
          </button>
        `;
      }).join("");

    function updateTopPills() {
      Object.keys(EXAM_DATA).forEach(id => {
        const pill = document.getElementById(`topPill-${id}`);
        if (!pill) return;
        if (id === currentTrackId) {
          pill.className = "top-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-claude-500 text-white shadow-sm";
        } else {
          pill.className = "top-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition text-slate-600 dark:text-slate-300 hover:bg-stone-200/70 dark:hover:bg-slate-700/60";
        }
      });
    }

    function updateSectionTabs() {
      const tabs = ["blueprint", "matrix", "code", "quiz"];
      tabs.forEach(tab => {
        const btn = document.getElementById(`secBtn-${tab}`);
        if (!btn) return;
        if (tab === currentSection) {
          btn.className = "sec-tab flex items-center justify-center sm:justify-start gap-2.5 px-4 py-3 rounded-xl font-semibold text-xs sm:text-sm border transition bg-claude-500 text-white border-claude-500 shadow-md shadow-claude-500/20";
        } else {
          btn.className = "sec-tab flex items-center justify-center sm:justify-start gap-2.5 px-4 py-3 rounded-xl font-semibold text-xs sm:text-sm border transition bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-stone-200 dark:border-slate-800 hover:border-claude-500/40";
        }
      });
    }

    /*************************************************************************
     * RENDER HERO BANNER
     *************************************************************************/
    function renderTrackHero() {
      const track = EXAM_DATA[currentTrackId];
      const score = getTrackScore(currentTrackId);
      const hero = document.getElementById("trackHero");

      hero.innerHTML = `
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
          <div class="space-y-3 max-w-3xl">

                TRACK ${track.number}
              </span>
              <span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-stone-200/80 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                ${track.badge}
              </span>
              <span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
                <i class="ph-fill ph-seal-check"></i> ${track.statusBadge}

              </div>

      `;

    /*************************************************************************
     * RENDER ACTIVE SECTION
     *************************************************************************/
    function renderActiveSection() {
      const viewport = document.getElementById("sectionViewport");
      const track = EXAM_DATA[currentTrackId];

      if (currentSection === "blueprint") {
        viewport.innerHTML = renderBlueprintSection(track);
      } else if (currentSection === "matrix") {
        viewport.innerHTML = renderMatrixSection(track);
      } else if (currentSection === "code") {
        viewport.innerHTML = renderCodeSection(track);
      } else if (currentSection === "quiz") {
        viewport.innerHTML = renderQuizSection(track);
      }
    }

    /* --- SECTION A: EXAM BLUEPRINT --- */
    function renderBlueprintSection(track) {
      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h3 class="text-lg font-bold flex items-center gap-2">
                <i class="ph-fill ph-compass text-claude-500 text-xl"></i>
                <span>What's Asked on the ${track.title} Exam</span>

              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">

              </p>

              <span>Jump to Scenario Cheat Sheet</span>
              <i class="ph ph-arrow-right"></i>
            </button>
          </div>

          <div class="grid grid-cols-1 gap-5">
            ${track.domains.map(dom => `
              <div class="rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm hover:border-claude-500/40 transition">
                <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-4 border-b border-stone-100 dark:border-slate-800">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-claude-500/15 text-claude-500 flex items-center justify-center">
                      <i class="ph-fill ${dom.icon} text-xl"></i>
                    </div>
                    <h4 class="font-bold text-base sm:text-lg">${dom.title}</h4>
                  </div>
                  <span class="px-3 py-1 rounded-full text-xs font-mono font-bold bg-claude-500/15 text-claude-500 border border-claude-500/30">
                    Exam Weight: ${dom.weight}
                  </span>
                </div>
                <ul class="space-y-3 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                  ${dom.points.map(pt => `
                    <li class="flex items-start gap-2.5">
                      <i class="ph-fill ph-check-circle text-emerald-500 text-base mt-1 shrink-0"></i>
                      <span>${pt}</span>

                </ul>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    /* --- SECTION B: DECISION MATRIX --- */
    function renderMatrixSection(track) {
      const categories = ["ALL", ...new Set(track.decisionMatrix.map(item => item.category))];
      const filtered = track.decisionMatrix.filter(item => {
        const matchesCat = matrixCategoryFilter === "ALL" || item.category === matrixCategoryFilter;
        const q = matrixSearchQuery.toLowerCase().trim();
        const matchesSearch = !q || item.trigger.toLowerCase().includes(q) || item.action.toLowerCase().includes(q) || item.category.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      return `
        <div class="space-y-5">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-5 rounded-2xl border border-stone-200 dark:border-slate-800">
            <div>
              <h3 class="text-lg font-bold flex items-center gap-2">
                <i class="ph-fill ph-lightning text-amber-500 text-xl"></i>
                <span>Exam Decision Matrix ("If You See X &rarr; Choose Y")</span>
              </h3>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                 Instant pattern-matching guide mapping question stems directly to the verified correct answer.
              </p>
            </div>

            <!-- Search Input -->
            <div class="relative w-full md:w-80">
              <i class="ph ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input
                type="text"
                value="${matrixSearchQuery.replace(/"/g, '&quot;')}"
                oninput="handleMatrixSearch(this.value)"
                placeholder="Search scenario keywords (e.g. HIPAA, JSON)..."
                class="w-full pl-10 pr-4 py-2.5 rounded-xl text-xs sm:text-sm bg-stone-100 dark:bg-slate-800 border border-stone-200 dark:border-slate-700 focus:outline-none focus:border-claude-500"
              />
            </div>
          </div>

          <!-- Category Filter Pills -->
          <div class="flex flex-wrap items-center gap-2">
            ${categories.map(cat => `
              <button onclick="setMatrixCategory('${cat}')"
                class="px-3.5 py-1.5 rounded-xl text-xs font-semibold border transition ${
                  matrixCategoryFilter === cat
                    ? 'bg-claude-500 text-white border-claude-500'
                    : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-stone-200 dark:border-slate-800 hover:border-claude-500/40'
                }">
                ${cat}
              </button>
            `).join("")}
          </div>

          <!-- Matrix Cards -->
          <div id="matrixResultsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${filtered.length === 0 ? `
              <div class="col-span-2 p-8 text-center rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 text-slate-500">
                No matching exam patterns found. Try clearing your search filter.
              </div>
            ` : filtered.map(row => `
              <div class="rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 p-5 flex flex-col justify-between gap-3 hover:border-claude-500/50 transition shadow-sm">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="text-[11px] font-mono uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-stone-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-semibold">
                      ${row.category}
                    </span>
                    <span class="text-xs text-slate-400 font-mono">IF YOU SEE &darr;</span>
                  </div>
                  <p class="text-sm font-semibold text-slate-800 dark:text-slate-100 leading-snug">
                    "${row.trigger}"
                  </p>
                </div>

                <div class="pt-3 border-t border-stone-100 dark:border-slate-800/80">
                  <div class="text-[11px] font-mono uppercase tracking-wider text-emerald-600 dark:text-emerald-400 font-bold mb-1 flex items-center gap-1">
                    <i class="ph-fill ph-arrow-elbow-down-right"></i> CHOOSE THIS ANSWER PATTERN:
                  </div>
                  <p class="text-xs sm:text-sm text-emerald-950 dark:text-emerald-200 bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3 font-medium leading-relaxed">
                    ${row.action}
                  </p>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function handleMatrixSearch(val) {
      matrixSearchQuery = val;
      const track = EXAM_DATA[currentTrackId];
      const filtered = track.decisionMatrix.filter(item => {
        const matchesCat = matrixCategoryFilter === "ALL" || item.category === matrixCategoryFilter;
        const q = matrixSearchQuery.toLowerCase().trim();
        const matchesSearch = !q || item.trigger.toLowerCase().includes(q) || item.action.toLowerCase().includes(q) || item.category.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });
      const listEl = document.getElementById("matrixResultsList");
      if (listEl) {
        listEl.innerHTML = filtered.length === 0 ? `
          <div class="col-span-2 p-8 text-center rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 text-slate-500">
            No matching exam patterns found.
          </div>
        ` : filtered.map(row => `
          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 p-5 flex flex-col justify-between gap-3 hover:border-claude-500/50 transition shadow-sm">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-[11px] font-mono uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-stone-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-semibold">
                  ${row.category}
                </span>
                <span class="text-xs text-slate-400 font-mono">IF YOU SEE &darr;</span>
              </div>
              <p class="text-sm font-semibold text-slate-800 dark:text-slate-100 leading-snug">
                "${row.trigger}"
              </p>
            </div>
            <div class="pt-3 border-t border-stone-100 dark:border-slate-800/80">
              <div class="text-[11px] font-mono uppercase tracking-wider text-emerald-600 dark:text-emerald-400 font-bold mb-1 flex items-center gap-1">
                <i class="ph-fill ph-arrow-elbow-down-right"></i> CHOOSE THIS ANSWER PATTERN:
              </div>
              <p class="text-xs sm:text-sm text-emerald-950 dark:text-emerald-200 bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3 font-medium leading-relaxed">
                ${row.action}
              </p>
            </div>
          </div>
        `).join("");
      }
    }

    function setMatrixCategory(cat) {
      matrixCategoryFilter = cat;
      renderActiveSection();
    }

    /* --- SECTION C: CODE & CONFIG PATTERNS --- */
    function renderCodeSection(track) {
      return `
        <div class="space-y-6">
          <div>
            <h3 class="text-lg font-bold flex items-center gap-2">
              <i class="ph-fill ph-code-block text-claude-500 text-xl"></i>
              <span>Reference Code, SDK & Configuration Patterns (${track.title})</span>
            </h3>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
              Copyable implementation blueprints reflecting the exact architectural and coding rules tested in this track.
            </p>
          </div>

          <div class="space-y-6">
            ${track.codePatterns.map((cp, idx) => `
              <div class="rounded-2xl overflow-hidden border border-stone-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
                <div class="p-4 sm:p-5 border-b border-stone-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="px-2.5 py-0.5 rounded-md text-[11px] font-mono font-semibold bg-claude-500/15 text-claude-500">
                        ${cp.tag}
                      </span>
                      <span class="text-xs font-mono uppercase text-slate-400">${cp.lang}</span>
                    </div>
                    <h4 class="font-bold text-base mt-1">${cp.title}</h4>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${cp.description}</p>
                  </div>
                  <button onclick="copyCodeBlock('codeBlock-${idx}')"
                    class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-stone-100 hover:bg-claude-500 hover:text-white dark:bg-slate-800 dark:hover:bg-claude-500 text-slate-700 dark:text-slate-200 border border-stone-200 dark:border-slate-700 transition flex items-center gap-1.5">
                    <i class="ph ph-copy text-sm"></i>
                    <span>Copy Code</span>
                  </button>
                </div>
                <pre id="codeBlock-${idx}" class="p-4 sm:p-5 bg-slate-950 text-slate-100 font-mono text-xs sm:text-sm overflow-x-auto leading-relaxed">${escapeHtml(cp.code)}</pre>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function copyCodeBlock(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const textArea = document.createElement("textarea");
      textArea.value = el.innerText;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand("copy");
        showToast("Code copied to clipboard!");
      } catch (err) {
        showToast("Unable to copy automatically.");
      }
      document.body.removeChild(textArea);
    }

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      const text = document.getElementById("toastMessage");
      text.textContent = msg;
      box.classList.remove("hidden");
      setTimeout(() => {
        box.classList.add("hidden");
      }, 2400);
    }

    /* --- SECTION D: INTERACTIVE PRACTICE EXAM --- */
    function renderQuizSection(track) {
      const score = getTrackScore(track.id);
      return `
        <div class="space-y-6">
          <!-- Score & Instructions Bar -->
          <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-stone-200 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h3 class="text-lg font-bold flex items-center gap-2">
                <i class="ph-fill ph-exam text-claude-500 text-xl"></i>
                <span>Interactive Practice Exam: ${track.title}</span>
              </h3>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                Select your answer(s) and click <strong>Check Answer</strong> for instant grading and official rationale.
              </p>
            </div>
            <div class="flex items-center gap-3 self-start sm:self-auto">
              <div class="px-4 py-2 rounded-xl bg-claude-500/10 border border-claude-500/30 text-claude-500 font-bold text-sm">
                Track Score: ${score.correct} / ${score.total}
              </div>
            </div>
          </div>

          <!-- Questions List -->
          <div class="space-y-5">
            ${track.questions.map((q, qIdx) => renderQuestionCard(q, qIdx)).join("")}
          </div>
        </div>
      `;
    }

    function renderQuestionCard(q, qIdx) {
      const state = quizState[q.id] || { selected: [], submitted: false, isCorrect: false };
      const isMulti = q.type === "multi";

      return `
        <div class="rounded-2xl bg-white dark:bg-slate-900 border ${
          state.submitted
            ? state.isCorrect
              ? 'border-emerald-500/60'
              : 'border-rose-500/60'
            : 'border-stone-200 dark:border-slate-800'
        } p-5 sm:p-6 shadow-sm transition">
          
          <div class="flex items-center justify-between gap-2 mb-3">
            <span class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold bg-stone-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
              Question ${qIdx + 1}
            </span>
            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${
              isMulti
                ? 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/30'
                : 'bg-blue-500/15 text-blue-600 dark:text-blue-400 border border-blue-500/30'
            }">
              ${isMulti ? 'Multi-Select (Select TWO)' : 'Single Choice'}
            </span>
          </div>

          <p class="text-sm sm:text-base font-semibold text-slate-800 dark:text-slate-100 whitespace-pre-line leading-relaxed mb-4">${q.stem}</p>

          <div class="space-y-2.5">
            ${q.options.map((opt, oIdx) => {
              const isSelected = state.selected.includes(oIdx);
              const isOptionCorrect = q.correct.includes(oIdx);

              let optionStyle = "bg-stone-50 dark:bg-slate-800/60 border-stone-200 dark:border-slate-700/80 hover:border-claude-500/50";
              if (state.submitted) {
                if (isOptionCorrect) {
                  optionStyle = "bg-emerald-500/15 border-emerald-500 text-emerald-950 dark:text-emerald-200 font-medium";
                } else if (isSelected && !isOptionCorrect) {
                  optionStyle = "bg-rose-500/15 border-rose-500 text-rose-950 dark:text-rose-200";
                }
              } else if (isSelected) {
                optionStyle = "bg-claude-500/15 border-claude-500 text-slate-900 dark:text-white font-medium";
              }

              return `
                <button
                  onclick="selectQuizOption('${q.id}', ${oIdx}, ${isMulti})"
                  ${state.submitted ? 'disabled' : ''}
                  class="w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm transition flex items-start gap-3 ${optionStyle}">
                  <div class="mt-0.5 w-5 h-5 rounded-${isMulti ? 'md' : 'full'} border flex items-center justify-center shrink-0 ${
                    isSelected ? 'border-claude-500 bg-claude-500 text-white' : 'border-slate-400'
                  }">
                    ${isSelected ? '<i class="ph-bold ph-check text-xs"></i>' : ''}
                  </div>
                  <span class="flex-1 leading-relaxed">${opt}</span>
                </button>
              `;
            }).join("")}
          </div>

          <!-- Actions & Rationale -->
          <div class="mt-4 pt-4 border-t border-stone-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
            ${!state.submitted ? `
              <button onclick="submitQuizAnswer('${q.id}')"
                class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-claude-500 hover:bg-claude-600 text-white shadow-sm transition">
                Check Answer
              </button>
            ` : `
              <div class="w-full space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs sm:text-sm font-bold flex items-center gap-1.5 ${
                    state.isCorrect ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'
                  }">
                    <i class="ph-fill ${state.isCorrect ? 'ph-check-circle' : 'ph-x-circle'} text-lg"></i>
                    ${state.isCorrect ? 'Correct! Verified Exam Answer' : 'Incorrect — Review the verified rationale below'}
                  </span>
                  <button onclick="resetSingleQuestion('${q.id}')" class="text-xs text-slate-400 hover:text-claude-500 underline">
                    Retry Question
                  </button>
                </div>
                <div class="p-3.5 rounded-xl bg-stone-100 dark:bg-slate-800/90 text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                  <strong class="text-slate-900 dark:text-white">Exam Rationale:</strong> ${q.rationale}
                </div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function selectQuizOption(questionId, optionIdx, isMulti) {
      const current = quizState[questionId] || { selected: [], submitted: false, isCorrect: false };
      if (current.submitted) return;

      let updatedSelected = [...current.selected];
      if (isMulti) {
        if (updatedSelected.includes(optionIdx)) {
          updatedSelected = updatedSelected.filter(i => i !== optionIdx);
        } else {
          updatedSelected.push(optionIdx);
        }
      } else {
        updatedSelected = [optionIdx];
      }

      quizState[questionId] = { ...current, selected: updatedSelected };
      renderActiveSection();
    }

    function submitQuizAnswer(questionId) {
      const track = EXAM_DATA[currentTrackId];
      const question = track.questions.find(q => q.id === questionId);
      if (!question) return;

      const current = quizState[questionId] || { selected: [], submitted: false, isCorrect: false };
      if (current.selected.length === 0) {
        showToast("Please select an option first.");
        return;
      }

      const sortedSelected = [...current.selected].sort();
      const sortedCorrect = [...question.correct].sort();
      const isCorrect =
        sortedSelected.length === sortedCorrect.length &&
        sortedSelected.every((val, index) => val === sortedCorrect[index]);

      quizState[questionId] = {
        ...current,
        submitted: true,
        isCorrect
      };

      renderActiveSection();
      renderDrawerTracks();
      updateGlobalScoreUI();
    }

    function resetSingleQuestion(questionId) {
      delete quizState[questionId];
      renderActiveSection();
      renderDrawerTracks();
      updateGlobalScoreUI();
    }

    function resetAllScores() {
      quizState = {};
      renderActiveSection();
      renderDrawerTracks();
      updateGlobalScoreUI();
      showToast("All practice exam scores reset.");
    }

    function getTrackScore(trackId) {
      const questions = EXAM_DATA[trackId].questions;
      let correct = 0;
      questions.forEach(q => {
        if (quizState[q.id]?.submitted && quizState[q.id]?.isCorrect) {
          correct++;
        }
      });
      return { correct, total: questions.length };
    }

    function updateGlobalScoreUI() {
      let totalCorrect = 0;
      let totalQuestions = 0;
      Object.keys(EXAM_DATA).forEach(tid => {
        const s = getTrackScore(tid);
        totalCorrect += s.correct;
        totalQuestions += s.total;
      });
      const badge = document.getElementById("globalScoreBadge");
      if (badge) badge.textContent = `${totalCorrect} / ${totalQuestions}`;

      const bar = document.getElementById("drawerProgressBar");
      if (bar && totalQuestions > 0) {
        bar.style.width = `${Math.round((totalCorrect / totalQuestions) * 100)}%`;
      }
    }

    window.onload = initApp;
  </script>
</body>
