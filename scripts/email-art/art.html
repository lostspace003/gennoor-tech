<!doctype html>
<!--
  The pictures used in the CRM email series, drawn as ordinary HTML, CSS and SVG.
  build.mjs opens this page in Chrome once per picture (?scene=name), steps every
  CSS animation forward frame by frame, and saves the frames as an animated GIF
  (or one PNG for an icon tile). Email apps cannot show SVG or CSS animation,
  which is why the pictures are drawn here and shipped as images.

  Each scene sets data-ms on #stage: how long its animation runs.
  Staged entrances use class "in" with style="--at:<ms>".
-->
<meta charset="utf-8">
<style>
  :root { --card:#0c1426; --panel:#16233f; --panel2:#1b2c50; --line:#2a3f6b; --text:#f2f6fc; --muted:#9db0cc; --blue:#3b9cff; --deep:#0071e3; --gold:#f5b83d; --green:#3ecf8e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:transparent; }
  body { font-family:'Segoe UI', system-ui, Arial, sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
  #stage { position:relative; width:600px; height:320px; overflow:hidden;
    background:#0c1426; }
  /* Flat colour on purpose: a gradient behind an animation makes the GIF several times heavier */
  svg.i { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }
  .in { animation:in 420ms cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--at,0) * 1ms); }
  @keyframes in { from { opacity:0; transform:translateY(14px) scale(.97); } to { opacity:1; transform:none; } }
  .kicker { font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
  .chip { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); font-size:15px; font-weight:600; }
  .chip svg { font-size:17px; color:var(--blue); }

  /* ---------- icon tile (one PNG per icon) ---------- */
  #tile { width:88px; height:88px; border-radius:24px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,#1f3563,#14213d); border:1.5px solid #34508a; color:#8cc4ff; font-size:42px; }
  /* ---------- art tile: the badge or mark of one certification or course ---------- */
  #tile.art { border:0; color:#fff; background-repeat:no-repeat; flex-direction:column; gap:3px; font-size:40px; }
  #tile.art b { font-size:15px; font-weight:800; letter-spacing:.02em; line-height:1; }
  #tile.art.small { font-size:30px; }
  svg.spark { width:1em; height:1em; fill:#fff; display:block; }
  #tile.gold { color:var(--gold); border-color:#6b5320; background:linear-gradient(145deg,#3a2f14,#1c1a12); }

  /* ---------- video: a few seconds of the promo, with a play button ---------- */
  .video img.frame { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .video .shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,10,22,.25) 0%, rgba(5,10,22,0) 35%, rgba(5,10,22,.85) 100%); }
  .video .play { position:absolute; left:50%; top:46%; width:84px; height:84px; margin:-42px 0 0 -42px; border-radius:50%; background:var(--deep); display:flex; align-items:center; justify-content:center; font-size:36px; color:#fff; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .video .play svg { fill:#fff; stroke:none; margin-left:5px; }
  .video .ring { position:absolute; left:50%; top:46%; width:84px; height:84px; margin:-42px 0 0 -42px; border-radius:50%; border:3px solid #fff; animation:ring 2000ms ease-out infinite; }
  @keyframes ring { from { transform:scale(1); opacity:.8; } to { transform:scale(1.9); opacity:0; } }
  .video .bar { position:absolute; left:22px; right:22px; bottom:18px; display:flex; align-items:center; gap:14px; font-size:15px; font-weight:600; }
  .video .track { flex:1; height:6px; border-radius:99px; background:rgba(255,255,255,.28); overflow:hidden; }
  .video .track i { display:block; height:100%; background:var(--blue); border-radius:99px; animation:fill 2500ms linear both; }
  @keyframes fill { from { width:8%; } to { width:34%; } }
  .video .tag { position:absolute; left:20px; top:18px; padding:7px 13px; border-radius:999px; background:rgba(5,10,22,.72); font-size:13.5px; font-weight:700; display:flex; gap:8px; align-items:center; }
  .video .tag svg { font-size:16px; color:var(--gold); }

  /* ---------- carousel: three cards, one in front at a time ---------- */
  .carousel .rail { position:absolute; left:0; top:34px; display:flex; gap:22px; padding-left:130px; margin-left:-362px; animation:slide 7200ms cubic-bezier(.65,0,.35,1) both; }
  @keyframes slide { 0%,28% { transform:translateX(0); } 33.3%,61% { transform:translateX(-362px); } 66.6%,94% { transform:translateX(-724px); } 100% { transform:translateX(-1086px); } }
  .ccard { width:340px; height:224px; flex:none; border-radius:16px; background:var(--panel); border:1px solid var(--line); overflow:hidden; }
  .ccard img { display:block; width:100%; height:150px; object-fit:cover; }
  .ccard .art { height:150px; display:flex; align-items:center; justify-content:center; font-size:72px; color:#fff; }
  .ccard .cap { padding:12px 16px; }
  .ccard b { display:block; font-size:17px; line-height:1.25; }
  .ccard span { display:block; margin-top:3px; font-size:13.5px; color:var(--muted); }
  .dots { position:absolute; left:0; right:0; bottom:20px; display:flex; justify-content:center; gap:9px; }
  .dots i { width:9px; height:9px; border-radius:50%; background:#3a4f7a; }
  .dots i:nth-child(1) { animation:d1 7200ms linear both; } .dots i:nth-child(2) { animation:d2 7200ms linear both; } .dots i:nth-child(3) { animation:d3 7200ms linear both; }
  @keyframes d1 { 0%,27% { background:var(--blue); width:26px; border-radius:9px; } 28%,94% { background:#3a4f7a; width:9px; } 95%,100% { background:var(--blue); width:26px; border-radius:9px; } }
  @keyframes d2 { 0%,27% { background:#3a4f7a; width:9px; } 28%,60% { background:var(--blue); width:26px; border-radius:9px; } 61%,100% { background:#3a4f7a; width:9px; } }
  @keyframes d3 { 0%,60% { background:#3a4f7a; width:9px; } 61%,94% { background:var(--blue); width:26px; border-radius:9px; } 95%,100% { background:#3a4f7a; width:9px; } }

  /* ---------- flow: your work goes in, a course comes out ---------- */
  .flow .left { position:absolute; left:26px; top:50px; display:flex; flex-direction:column; gap:16px; }
  .flow .arrow { position:absolute; left:236px; top:138px; width:74px; height:6px; border-radius:9px; background:#24365c; overflow:hidden; }
  .flow .arrow i { display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--blue),var(--gold)); transform-origin:left; animation:grow 900ms ease-out both; animation-delay:1500ms; }
  @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  .flow .course { position:absolute; right:26px; top:36px; width:258px; padding:18px; border-radius:16px; background:var(--panel); border:1px solid var(--line); }
  .flow .course h4 { font-size:18px; margin:6px 0 12px; }
  .flow .row { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid #22345a; font-size:14.5px; color:#dbe6f6; }
  .flow .row svg { font-size:17px; color:var(--green); }

  /* ---------- time: two bars, the second one shrinks ---------- */
  .time { padding:34px 34px 0; }
  .time h3 { font-size:17px; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .time h3 small { font-size:14.5px; font-weight:500; color:var(--muted); }
  .time .bar { height:34px; border-radius:10px; background:#1b2b4d; overflow:hidden; margin-bottom:34px; }
  .time .bar i { display:block; height:100%; border-radius:10px; }
  .time .b1 i { width:100%; background:linear-gradient(90deg,#1e6fe0,var(--blue)); }
  .time .b2 i { background:linear-gradient(90deg,#e09a1a,var(--gold)); animation:shrink 2200ms cubic-bezier(.2,.8,.2,1) both; animation-delay:700ms; }
  @keyframes shrink { from { width:100%; } to { width:40%; } }
  .time .result { position:absolute; left:34px; bottom:34px; display:flex; align-items:baseline; gap:12px; }
  .time .result b { font-size:46px; line-height:1; color:var(--gold); letter-spacing:-.02em; }
  .time .result span { font-size:17px; font-weight:600; }

  /* ---------- build: six modules, one working project ---------- */
  .build { padding:30px 30px 0; }
  .build .mods { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-top:20px; }
  .build .mod { height:92px; border-radius:14px; background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-size:13px; font-weight:600; color:var(--muted); }
  .build .mod svg { font-size:26px; color:var(--green); }
  .build .prog { margin-top:24px; height:10px; border-radius:99px; background:#1b2b4d; overflow:hidden; }
  .build .prog i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--blue),var(--green)); animation:prog 2700ms linear both; animation-delay:300ms; }
  @keyframes prog { from { width:0; } to { width:100%; } }
  .build .done { position:absolute; left:30px; right:30px; bottom:26px; display:flex; align-items:center; gap:12px; font-size:19px; font-weight:700; }
  .build .done svg { font-size:30px; color:var(--gold); }

  /* ---------- chat: a question, a trainer's answer, kept for the next person ---------- */
  .chat { padding:30px 34px; }
  .chat .b { max-width:400px; padding:13px 17px; border-radius:18px; font-size:16.5px; line-height:1.4; margin-bottom:14px; }
  .chat .who { font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .chat .q { background:var(--panel2); border:1px solid var(--line); border-bottom-left-radius:6px; }
  .chat .a { margin-left:auto; background:var(--deep); border-bottom-right-radius:6px; }
  .chat .a .who { color:#cfe3fd; }
  .chat .saved { position:absolute; left:34px; bottom:26px; }

  /* ---------- dashboard: a learning platform with your name on it ---------- */
  .dash .win { position:absolute; inset:26px 30px 0; border-radius:16px 16px 0 0; background:var(--panel); border:1px solid var(--line); border-bottom:0; overflow:hidden; }
  .dash .top { display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid #22345a; font-size:15px; font-weight:700; }
  .dash .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--gold),#e07a1a); display:flex; align-items:center; justify-content:center; color:#2b1c00; font-size:17px; }
  .dash .top em { margin-left:auto; font-style:normal; font-size:13px; font-weight:600; color:var(--muted); }
  .dash .grid { display:grid; grid-template-columns:1fr 1fr 150px; gap:14px; padding:18px; }
  .dash .c { border-radius:12px; background:#101c36; border:1px solid #22345a; padding:14px; }
  .dash .c svg { font-size:24px; color:var(--blue); }
  .dash .c b { display:block; font-size:14.5px; margin:9px 0 12px; }
  .dash .c .p { height:7px; border-radius:99px; background:#1b2b4d; overflow:hidden; }
  .dash .c .p i { display:block; height:100%; border-radius:99px; background:var(--green); animation:pw 1800ms ease-out both; animation-delay:calc(var(--at) * 1ms); width:var(--w); }
  @keyframes pw { from { width:0; } to { width:var(--w); } }
  .dash .ring { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; font-size:12.5px; color:var(--muted); font-weight:600; }
  .dash .ring svg.r { width:82px; height:82px; transform:rotate(-90deg); }
  .dash .ring circle { fill:none; stroke-width:9; }
  .dash .ring .fg { stroke:var(--gold); stroke-linecap:round; stroke-dasharray:214; animation:ring2 2000ms ease-out both; animation-delay:500ms; }
  @keyframes ring2 { from { stroke-dashoffset:214; } to { stroke-dashoffset:47; } }
</style>
<body>
<script>
const ART = window.ART || { icons: {}, files: {} }
const q = new URLSearchParams(location.search)
const scene = q.get('scene') || 'time'
const ic = (name) => `<svg class="i" viewBox="0 0 24 24">${ART.icons[name] || ''}</svg>`
// The eight-ray spark the site already uses for its Claude pages
const spark = '<svg class="spark" viewBox="0 0 24 24"><path d="M12 2l1.6 6.1L19 4.9l-3.4 5.2 6.1 1.9-6.1 1.9L19 19.1l-5.4-3.2L12 22l-1.6-6.1L5 19.1l3.4-5.2L2.3 12l6.1-1.9L5 4.9l5.4 3.2L12 2z"/></svg>'
const CLAUDE_BG = 'linear-gradient(145deg,#e08a63,#b4532f)'
const stage = (cls, ms, html) => { document.body.innerHTML = `<div id="stage" class="${cls}" data-ms="${ms}">${html}</div>` }

const carousel = (cards) => stage('carousel', 7200,
  `<div class="rail">${[cards[2], ...cards, ...cards].map((c) => `<div class="ccard">${c.img ? `<img src="${c.img}">` : `<div class="art" style="background:${c.bg}">${c.spark ? spark : ic(c.icon)}</div>`}<div class="cap"><b>${c.title}</b><span>${c.line}</span></div></div>`).join('')}</div>
   <div class="dots"><i></i><i></i><i></i></div>`)

const SCENES = {
  icon() {
    document.body.innerHTML = `<div id="tile" class="${q.get('tone') || ''}">${ic(q.get('name'))}</div>`
  },
  art() {
    const a = JSON.parse(q.get('a'))
    const style = a.img ? `background-image:url(${ART.files[a.img]});background-size:${a.size};background-position:${a.pos}` : `background:${a.claude ? CLAUDE_BG : a.bg}`
    const inside = a.img ? '' : a.code ? `${spark}<b>${a.code}</b>` : a.claude ? spark : ic(a.icon)
    document.body.innerHTML = `<div id="tile" class="art ${a.code ? 'small' : ''}" style="${style}">${inside}</div>`
  },
  video() {
    stage('video', 2500, `<img class="frame" id="f" src="${ART.files.clip[0]}"><div class="shade"></div>
      <div class="tag">${ic('sparkles')} AI-103 course preview</div>
      <div class="ring"></div><div class="play">${ic('play')}</div>
      <div class="bar">${ic('volume-2')}<span>Play with sound</span><div class="track"><i></i></div><span>1:48</span></div>`)
    const f = document.getElementById('f')
    window.tick = (ms) => { f.src = ART.files.clip[Math.min(ART.files.clip.length - 1, Math.floor(ms / 125))] }
  },
  courses() {
    carousel([
      { img: ART.files['thumb-ai-103'], title: 'AI-103: Build and Ship AI Agents', line: 'Microsoft Azure · one project, start to finish' },
      { img: ART.files['thumb-ai-500'], title: 'AI-500: Multi-Agent AI Solutions', line: 'For engineers and architects' },
      { spark: true, bg: CLAUDE_BG, title: 'Claude certification guides', line: 'Four guides, each with a practice exam' },
    ])
  },
  claude() {
    carousel([
      { spark: true, bg: CLAUDE_BG, title: 'Certification preparation', line: 'Four guides, each with a practice exam' },
      { icon: 'users', bg: 'linear-gradient(135deg,#1e6fe0,#123a80)', title: 'Claude training for teams', line: 'Everyday work, Cowork and Claude Code' },
      { icon: 'workflow', bg: 'linear-gradient(135deg,#1f9d6b,#0e5038)', title: 'Automation', line: 'One process at a time, tested on your examples' },
    ])
  },
  custom() {
    stage('flow', 4200, `<div class="left">
        <div class="chip in" style="--at:200">${ic('wrench')} Your tools</div>
        <div class="chip in" style="--at:600">${ic('workflow')} Your processes</div>
        <div class="chip in" style="--at:1000">${ic('file-text')} Your examples</div>
      </div>
      <div class="arrow"><i></i></div>
      <div class="course in" style="--at:2300"><div class="kicker">Your course</div><h4>Built for your team</h4>
        <div class="row in" style="--at:2800">${ic('circle-check')} Lessons on your own work</div>
        <div class="row in" style="--at:3200">${ic('circle-check')} A voice and presenter you choose</div>
        <div class="row in" style="--at:3600">${ic('circle-check')} An assistant that knows it</div>
      </div>`)
  },
  time() {
    stage('time', 3400, `<h3>A usual course <small>3 to 5 days in a classroom</small></h3><div class="bar b1"><i></i></div>
      <h3>Lessons and labs first <small>trainer for the questions</small></h3><div class="bar b2"><i></i></div>
      <div class="result in" style="--at:2700"><b>about 60%</b><span>less classroom time is our aim</span></div>`)
  },
  build() {
    stage('build', 3800, `<div class="kicker">One project, built module by module</div>
      <div class="mods">${[1, 2, 3, 4, 5, 6].map((n) => `<div class="mod in" style="--at:${300 + (n - 1) * 450}">${ic('circle-check')}Module ${n}</div>`).join('')}</div>
      <div class="prog"><i></i></div>
      <div class="done in" style="--at:3200">${ic('rocket')} A working project at the end</div>`)
  },
  chat() {
    stage('chat', 4200, `<div class="b q in" style="--at:300"><div class="who">Learner · a week later</div>How do I do this on our own data?</div>
      <div class="b a in" style="--at:1700"><div class="who">Trainer</div>Here is the step you need. Shall we look at it together on a call?</div>
      <div class="chip saved in" style="--at:3200">${ic('bookmark-check')} Kept on the platform for the next person</div>`)
  },
  platform() {
    stage('dash', 3600, `<div class="win"><div class="top"><div class="logo">${ic('building-2')}</div>Your company academy<em>Your courses · your people</em></div>
      <div class="grid">
        <div class="c in" style="--at:300">${ic('monitor-play')}<b>Onboarding course</b><div class="p"><i style="--w:82%;--at:800"></i></div></div>
        <div class="c in" style="--at:650">${ic('flask-conical')}<b>Product labs</b><div class="p"><i style="--w:56%;--at:1150"></i></div></div>
        <div class="c ring in" style="--at:1000"><svg class="r" viewBox="0 0 82 82"><circle cx="41" cy="41" r="34" stroke="#1b2b4d"/><circle class="fg" cx="41" cy="41" r="34"/></svg>Team progress</div>
      </div></div>`)
  },
}
SCENES[scene]()
// Everything is driven from outside: the animations stand still until build.mjs moves them
document.getAnimations().forEach((a) => a.pause())
window.seek = (ms) => { document.getAnimations().forEach((a) => { a.currentTime = ms }); if (window.tick) window.tick(ms) }
</script>
</body>
