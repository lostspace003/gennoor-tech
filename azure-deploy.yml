name: Deploy Lead Management to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: gennoor-leads
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Next.js application
      run: npm run build
      env:
        NEXTAUTH_URL: https://gennoor-leads.azurewebsites.net
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

    - name: 'Deploy to Azure WebApp'
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: 'Deploy Database'
      run: |
        az postgres flexible-server create \
          --resource-group gennoor-rg \
          --name gennoor-leads-db \
          --location centralindia \
          --admin-user gennoradmin \
          --admin-password ${{ secrets.DB_PASSWORD }} \
          --sku-name Standard_B2s \
          --version 16 \
          --storage-size 32 \
          --public-access 0.0.0.0