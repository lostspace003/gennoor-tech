name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One pipeline at a time: parallel runs used to hit the App Service together
# and fail with OneDeploy 409 Conflict. Queue runs; never cancel a deploy
# mid-flight.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: gennoor-tech
  NODE_VERSION: '22.x'

jobs:
  # ── Build & Validate (runs on all branches) ──
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BLOB_URL: "/media"
          NEXT_PUBLIC_SITE_URL: "https://gennoor.com"
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CAREER_API_URL: ${{ secrets.NEXT_PUBLIC_CAREER_API_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: "https://gennoor-tech.azurewebsites.net"
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_COMMUNICATION_CONNECTION_STRING: ${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}

      # Only deploy on main branch (push or manual trigger)
      - name: Prepare deployment package
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          # The CONTENTS of each folder go INTO its place ("folder/." into "place/"). "cp -r public deploy/public"
          # only does that while deploy/public does not exist yet. The build puts a few public files there itself
          # (the ones server code reads), and then the same command makes deploy/public/public. On 20 November 2026
          # the whole public folder was shipped to /public/... that way; the site's pictures kept working only
          # because the deploy before had left its copies on the server (a deploy removes nothing).
          mkdir -p deploy/.next/static deploy/public
          cp -r .next/static/. deploy/.next/static/
          cp -r public/. deploy/public/
          # Stop here rather than ship a site without its pictures
          test -f deploy/public/favicon.ico || { echo "::error::public/ did not land in deploy/public"; exit 1; }
          test ! -e deploy/public/public || { echo "::error::deploy/public/public exists: public/ was copied one level too deep"; exit 1; }
          echo "Deploy package contents:"
          ls -la deploy/.next/ || echo "No .next dir!"

      - name: Azure Login
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Runtime settings the CRM needs on the App Service (Foundry web search SP).
      # Runs before deploy so new code always starts with its settings present.
      - name: Sync CRM app settings
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          RG=$(az webapp list --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}'].resourceGroup" -o tsv)
          az webapp config appsettings set -g "$RG" -n "${{ env.AZURE_WEBAPP_NAME }}" --output none --settings \
            FOUNDRY_API_KEY="${{ secrets.FOUNDRY_API_KEY }}" \
            FOUNDRY_OPENAI_BASE="https://admin-0564-resource.openai.azure.com" \
            FOUNDRY_WEB_MODEL="gpt-5.4" \
            CRM_CRON_SECRET="${{ secrets.CRM_CRON_SECRET }}" \
            MS_GRAPH_TENANT_ID="${{ secrets.MS_GRAPH_TENANT_ID }}" \
            MS_GRAPH_CLIENT_ID="${{ secrets.MS_GRAPH_CLIENT_ID }}" \
            MS_GRAPH_CLIENT_SECRET="${{ secrets.MS_GRAPH_CLIENT_SECRET }}" \
            AZURE_SEARCH_ENDPOINT="https://gennoor-search.search.windows.net" \
            AZURE_SEARCH_ADMIN_KEY="${{ secrets.AZURE_SEARCH_ADMIN_KEY }}"

      # Online payment for the AI Weekend. The three values live in GitHub secrets and are copied to the
      # App Service on every deploy. Until the secrets exist this step does nothing and payment stays off.
      - name: Sync Razorpay settings
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          RZP_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RZP_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RZP_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$RZP_KEY_ID" ] || [ -z "$RZP_KEY_SECRET" ]; then
            echo "Razorpay secrets are not set. Online payment stays off."
            exit 0
          fi
          RG=$(az webapp list --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}'].resourceGroup" -o tsv)
          az webapp config appsettings set -g "$RG" -n "${{ env.AZURE_WEBAPP_NAME }}" --output none --settings \
            RAZORPAY_KEY_ID="$RZP_KEY_ID" \
            RAZORPAY_KEY_SECRET="$RZP_KEY_SECRET" \
            RAZORPAY_WEBHOOK_SECRET="$RZP_WEBHOOK_SECRET"
          echo "Razorpay settings copied to the App Service."

      - name: Deploy to Azure Web App
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy

      - name: Health check
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gennoor-tech.azurewebsites.net/)
          echo "Health check status: $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "::error::Health check failed with status $STATUS"
            exit 1
          fi
          echo "Deployment healthy!"
