name: CRM Morning Digest

on:
  schedule:
    - cron: '0 1 * * 1-6' # 06:30 IST, Monday-Saturday
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CRM digest email
        run: |
          STATUS=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRM_CRON_SECRET }}" \
            https://gennoor-tech.azurewebsites.net/api/admin/crm-digest)
          cat /tmp/out.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Digest failed with status $STATUS"
            exit 1
          fi
