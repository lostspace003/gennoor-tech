name: GennoorCare Site Index

on:
  schedule:
    - cron: '30 2 1 * *' # 1st of every month, 08:00 IST
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Start reindex (async job)
        run: |
          STATUS=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST --max-time 60 \
            -H "x-cron-secret: ${{ secrets.CRM_CRON_SECRET }}" \
            https://gennoor-tech.azurewebsites.net/api/admin/site-index)
          cat /tmp/out.json
          if [ "$STATUS" != "202" ] && [ "$STATUS" != "409" ]; then
            echo "::error::Failed to start index (status $STATUS)"
            exit 1
          fi

      - name: Wait for completion
        run: |
          for i in $(seq 1 120); do
            sleep 30
            curl -s -H "x-cron-secret: ${{ secrets.CRM_CRON_SECRET }}" \
              https://gennoor-tech.azurewebsites.net/api/admin/site-index > /tmp/status.json
            STATE=$(python3 -c "import json;print(json.load(open('/tmp/status.json')).get('job',{}).get('state',''))" 2>/dev/null)
            echo "poll $i: $STATE"
            if [ "$STATE" = "done" ]; then cat /tmp/status.json; exit 0; fi
            if [ "$STATE" = "error" ]; then cat /tmp/status.json; echo "::error::Index job failed"; exit 1; fi
          done
          echo "::error::Index did not finish within 20 minutes"
          exit 1

      # The CRM lead index rides the same monthly schedule. Leads change far
      # more often than the site, but the copilot degrades gracefully when a
      # lead isn't indexed yet (it falls back to the full snapshot), so monthly
      # is enough — and a manager can trigger it any time from the CRM.
      - name: Re-sync CRM lead vectors
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /tmp/leads.json -w "%{http_code}" -X POST --max-time 600 \
            -H "x-cron-secret: ${{ secrets.CRM_CRON_SECRET }}" \
            "https://gennoor-tech.azurewebsites.net/api/admin/leads/vector-sync?full=1")
          cat /tmp/leads.json
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Lead vector sync returned $STATUS (site index still succeeded)"
          fi
