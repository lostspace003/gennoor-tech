name: LinkedIn Autopilot

# Every 15 minutes. The route does nothing unless the autopilot is switched on in the admin centre, and every run is
# idempotent, so a delayed or doubled trigger is harmless.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Run an autopilot tick
        run: |
          STATUS=$(curl -s -o /tmp/out.json -w "%{http_code}" -m 60 -X POST \
            -H "x-cron-secret: ${{ secrets.CRM_CRON_SECRET }}" \
            https://gennoor-tech.azurewebsites.net/api/cron/autopilot)
          cat /tmp/out.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Autopilot trigger failed with status $STATUS"
            exit 1
          fi
