<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Certification Exam Prep Hub | Gennoor</title>
  <meta name="description" content="Blueprints, decision matrices, code patterns and full-length practice exams for all four official Anthropic Claude certifications." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            claude: {
              50: '#fdf6f3', 100: '#fbeae3', 200: '#f7d6c8', 300: '#f0b8a1', 400: '#e6906e',
              500: '#d97757', 600: '#c65d3b', 700: '#a5492c', 800: '#873e28', 900: '#703524'
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.1); }
    ::-webkit-scrollbar-thumb { background: rgba(217, 119, 87, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(217, 119, 87, 0.7); }
    .drawer-backdrop { backdrop-filter: blur(4px); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
  </style>
</head>
<body class="bg-stone-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans min-h-screen flex flex-col selection:bg-claude-500 selection:text-white transition-colors duration-200">

  <!-- TOP BAR -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-stone-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <button onclick="HUB.toggleDrawer()" aria-label="Open certification menu"
          class="p-2.5 rounded-xl bg-stone-100 hover:bg-claude-500/15 text-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-claude-500/20 border border-stone-200 dark:border-slate-700 transition flex items-center gap-2 group shrink-0">
          <i class="ph ph-list text-2xl text-claude-500 group-hover:scale-110 transition-transform"></i>
          <span class="text-xs font-semibold uppercase tracking-wider hidden sm:inline">Exams</span>
        </button>
        <div class="flex items-center gap-2.5 min-w-0">
          <a href="/claude/certifications" class="w-9 h-9 rounded-xl bg-gradient-to-br from-claude-500 to-amber-600 flex items-center justify-center text-white shadow-md shadow-claude-500/20 shrink-0" aria-label="Back to Claude certification prep">
            <i class="ph-fill ph-sparkle text-lg"></i>
          </a>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h1 class="font-bold text-base sm:text-lg tracking-tight leading-none truncate">Claude Certification Prep Hub</h1>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">
              <a href="/claude/certifications" class="hover:text-claude-500">Gennoor · all certification courses ›</a>
            </p>
            <p id="activeTrackSubtitle" class="sr-only"></p>
          </div>
        </div>
      </div>

      <nav class="hidden xl:flex items-center gap-1.5 bg-stone-100 dark:bg-slate-800/90 p-1.5 rounded-xl border border-stone-200 dark:border-slate-700/80">
        <button onclick="HUB.switchTrack('ccas-f')" id="topPill-ccas-f" class="top-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition">CCAS-F Associate</button>
        <button onclick="HUB.switchTrack('ccdv-f')" id="topPill-ccdv-f" class="top-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition">CCDV-F Developer</button>
        <button onclick="HUB.switchTrack('ccar-f')" id="topPill-ccar-f" class="top-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition">CCAR-F Architect</button>
        <button onclick="HUB.switchTrack('ccar-p')" id="topPill-ccar-p" class="top-pill px-3 py-1.5 rounded-lg text-xs font-semibold transition">CCAR-P Architect Pro</button>
      </nav>

      <div class="flex items-center gap-2.5 shrink-0">
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-600 dark:text-emerald-400 text-xs font-semibold">
          <i class="ph-fill ph-check-circle text-base"></i>
          <span>Score: <strong id="globalScoreBadge">0 / 0</strong></span>
        </div>
        <button onclick="HUB.toggleTheme()" aria-label="Toggle dark or light mode"
          class="p-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-stone-200 dark:border-slate-700 transition">
          <i id="themeIcon" class="ph ph-sun text-xl text-amber-400"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- DRAWER -->
  <div id="drawerBackdrop" onclick="HUB.toggleDrawer(false)"
    class="fixed inset-0 z-50 bg-slate-950/60 drawer-backdrop hidden opacity-0 transition-opacity duration-200"></div>
  <aside id="sidebarDrawer"
    class="fixed top-0 left-0 z-50 h-full w-80 sm:w-96 bg-white dark:bg-slate-900 border-r border-stone-200 dark:border-slate-800 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col justify-between">
    <div>
      <div class="p-5 border-b border-stone-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-claude-500 flex items-center justify-center text-white">
            <i class="ph-fill ph-graduation-cap text-xl"></i>
          </div>
          <div>
            <h2 class="font-bold text-base">The four certifications</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Pick an exam to load its prep track</p>
          </div>
        </div>
        <button onclick="HUB.toggleDrawer(false)" class="p-2 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-stone-100 dark:hover:bg-slate-800 transition">
          <i class="ph ph-x text-xl"></i>
        </button>
      </div>
      <div class="p-4 space-y-2.5 overflow-y-auto max-h-[calc(100vh-190px)]" id="drawerTrackList"></div>
    </div>
    <div class="p-4 border-t border-stone-200 dark:border-slate-800 bg-stone-50 dark:bg-slate-950/60">
      <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 mb-2">
        <span>Overall practice progress</span>
        <button onclick="HUB.resetAll()" class="text-rose-500 hover:underline font-medium flex items-center gap-1">
          <i class="ph ph-arrow-counter-clockwise"></i> Reset all
        </button>
      </div>
      <div class="w-full h-2 rounded-full bg-stone-200 dark:bg-slate-800 overflow-hidden">
        <div id="drawerProgressBar" class="h-full bg-gradient-to-r from-claude-500 to-emerald-500 transition-all duration-300" style="width: 0%"></div>
      </div>
      <a href="/claude/certifications" class="block text-center text-xs font-semibold text-claude-500 hover:underline mt-3">← All Claude certification courses</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <section id="trackHero" class="relative rounded-2xl overflow-hidden border border-stone-200 dark:border-slate-800 bg-gradient-to-br from-white via-stone-50 to-orange-50/40 dark:from-slate-900 dark:via-slate-900 dark:to-slate-950 p-6 sm:p-8 shadow-sm mb-6"></section>

    <div class="sticky top-16 z-30 bg-stone-50/95 dark:bg-slate-950/95 backdrop-blur py-3 mb-6 border-b border-stone-200 dark:border-slate-800">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
        <button onclick="HUB.switchSection('blueprint')" id="secBtn-blueprint" class="sec-tab flex items-center justify-center sm:justify-start gap-2.5 px-4 py-3 rounded-xl font-semibold text-xs sm:text-sm border transition">
          <i class="ph-fill ph-compass text-lg"></i><span>A. Exam Blueprint</span>
        </button>
        <button onclick="HUB.switchSection('matrix')" id="secBtn-matrix" class="sec-tab flex items-center justify-center sm:justify-start gap-2.5 px-4 py-3 rounded-xl font-semibold text-xs sm:text-sm border transition">
          <i class="ph-fill ph-lightning text-lg"></i><span>B. Decision Matrix</span>
        </button>
        <button onclick="HUB.switchSection('code')" id="secBtn-code" class="sec-tab flex items-center justify-center sm:justify-start gap-2.5 px-4 py-3 rounded-xl font-semibold text-xs sm:text-sm border transition">
          <i class="ph-fill ph-code-block text-lg"></i><span>C. Code &amp; Configs</span>
        </button>
        <button onclick="HUB.switchSection('quiz')" id="secBtn-quiz" class="sec-tab flex items-center justify-center sm:justify-start gap-2.5 px-4 py-3 rounded-xl font-semibold text-xs sm:text-sm border transition">
          <i class="ph-fill ph-exam text-lg"></i><span>D. Practice Exam</span>
        </button>
      </div>
    </div>

    <div id="sectionViewport" class="animate-fade-in"></div>
  </main>

  <div id="toastBox" class="fixed bottom-5 right-5 z-50 hidden transform transition-all duration-300">
    <div class="flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-xl border border-slate-700 dark:border-stone-200 text-sm font-medium">
      <i class="ph-fill ph-check-circle text-emerald-400 dark:text-emerald-600 text-lg"></i>
      <span id="toastMessage">Done</span>
    </div>
  </div>

  <script src="/claude-certifications/prep-hub/banks.js?v=12"></script>
  <script src="/claude-certifications/prep-hub/data.js?v=12"></script>
  <script src="/claude-certifications/prep-hub/hub.js?v=12"></script>
  <script>window.GUIDE_KEY='prep-hub';window.GUIDE_TITLE='the Claude certification prep hub';window.GATE_MODE='hub';</script>
  <script src="/claude-certifications/gate.js?v=12"></script>
</body>
</html>
