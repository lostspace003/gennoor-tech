<svg xmlns="http://www.w3.org/2000/svg" width="176" height="176" viewBox="0 0 176 176">
  <defs>
    <radialGradient id="gnavy" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0C1426"/>
    </radialGradient>
  </defs>

  <!-- breathing halo -->
  <circle cx="88" cy="88" r="84" fill="none" stroke="#2563EB" stroke-width="3" stroke-opacity="0.25">
    <animate attributeName="stroke-opacity" values="0.12;0.38;0.12" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- navy body -->
  <circle cx="88" cy="88" r="78" fill="url(#gnavy)"/>

  <!-- brand dot ring (soft blue) + amber trail -->
  <g transform="translate(36,36) scale(0.8)">
    <g fill="#93b4ff">
      <circle cx="105.8" cy="84" r="6"/><circle cx="93.4" cy="99.9" r="6"/><circle cx="75.4" cy="108.8" r="6"/>
      <circle cx="55.3" cy="108.9" r="6"/><circle cx="37.1" cy="100.3" r="6"/><circle cx="24.5" cy="84.6" r="6"/>
      <circle cx="20" cy="65" r="6"/><circle cx="24.5" cy="45.4" r="6"/><circle cx="37.1" cy="29.7" r="6"/>
      <circle cx="55.3" cy="21.1" r="6"/><circle cx="75.4" cy="21.2" r="6"/><circle cx="93.4" cy="30.1" r="6"/>
    </g>
    <g fill="#F59E0B">
      <circle cx="80" cy="65" r="6">
        <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="95" cy="65" r="6">
        <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="65" r="6">
        <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- presence light with gentle ping -->
  <circle cx="146" cy="34" r="13" fill="#22c55e" opacity="0.35">
    <animate attributeName="r" values="13;20;13" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="146" cy="34" r="11" fill="#22c55e" stroke="#0C1426" stroke-width="4"/>
</svg>
