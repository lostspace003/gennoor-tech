<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="GennoorBot">
  <!--
    Animated companion to gennoorbot-avatar-256.png (generated with FLUX.2-pro).
    Same motif — a dot ring graduating blue to amber on navy, with a breathing
    core — but as SVG rather than a GIF or video: a few KB instead of megabytes,
    crisp at any size, and it costs nothing to decode on a button that sits on
    every page. Animation pauses for anyone who prefers reduced motion.
  -->
  <defs>
    <radialGradient id="gbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0C1426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gbRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#d8b26a"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </linearGradient>
    <style>
      /* The ring is deliberately stationary — the agent inside it is what
         moves. Two moving elements competing in a 40px button reads as noise. */
      .gb-core { transform-origin: 60px 60px; animation: gb-breathe 4.2s ease-in-out infinite; }
      @keyframes gb-breathe {
        0%, 100% { opacity: 0.45; transform: scale(0.96); }
        50%      { opacity: 0.8;  transform: scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) { .gb-core { animation: none; } }
    </style>
  </defs>

  <circle cx="60" cy="60" r="60" fill="#0C1426"/>
  <circle class="gb-core" cx="60" cy="60" r="34" fill="url(#gbCore)"/>

  <!-- Outer ring: 44 dots, one gap so the rotation reads -->
  <g fill="url(#gbRing)">
    <g id="gbOuter">
      <circle cx="60" cy="15" r="2.5"/>
    </g>
    <use href="#gbOuter" transform="rotate(8 60 60)"/>
    <use href="#gbOuter" transform="rotate(16 60 60)"/>
    <use href="#gbOuter" transform="rotate(24 60 60)"/>
    <use href="#gbOuter" transform="rotate(32 60 60)"/>
    <use href="#gbOuter" transform="rotate(40 60 60)"/>
    <use href="#gbOuter" transform="rotate(48 60 60)"/>
    <use href="#gbOuter" transform="rotate(56 60 60)"/>
    <use href="#gbOuter" transform="rotate(64 60 60)"/>
    <use href="#gbOuter" transform="rotate(72 60 60)"/>
    <use href="#gbOuter" transform="rotate(80 60 60)"/>
    <use href="#gbOuter" transform="rotate(88 60 60)"/>
    <use href="#gbOuter" transform="rotate(96 60 60)"/>
    <use href="#gbOuter" transform="rotate(104 60 60)"/>
    <use href="#gbOuter" transform="rotate(112 60 60)"/>
    <use href="#gbOuter" transform="rotate(120 60 60)"/>
    <use href="#gbOuter" transform="rotate(128 60 60)"/>
    <use href="#gbOuter" transform="rotate(136 60 60)"/>
    <use href="#gbOuter" transform="rotate(144 60 60)"/>
    <use href="#gbOuter" transform="rotate(152 60 60)"/>
    <use href="#gbOuter" transform="rotate(160 60 60)"/>
    <use href="#gbOuter" transform="rotate(168 60 60)"/>
    <use href="#gbOuter" transform="rotate(176 60 60)"/>
    <use href="#gbOuter" transform="rotate(184 60 60)"/>
    <use href="#gbOuter" transform="rotate(192 60 60)"/>
    <use href="#gbOuter" transform="rotate(200 60 60)"/>
    <use href="#gbOuter" transform="rotate(208 60 60)"/>
    <use href="#gbOuter" transform="rotate(216 60 60)"/>
    <use href="#gbOuter" transform="rotate(224 60 60)"/>
    <use href="#gbOuter" transform="rotate(232 60 60)"/>
    <use href="#gbOuter" transform="rotate(240 60 60)"/>
    <use href="#gbOuter" transform="rotate(248 60 60)"/>
    <use href="#gbOuter" transform="rotate(256 60 60)"/>
    <use href="#gbOuter" transform="rotate(264 60 60)"/>
    <use href="#gbOuter" transform="rotate(272 60 60)"/>
    <use href="#gbOuter" transform="rotate(280 60 60)"/>
    <use href="#gbOuter" transform="rotate(288 60 60)"/>
    <use href="#gbOuter" transform="rotate(296 60 60)"/>
    <use href="#gbOuter" transform="rotate(312 60 60)"/>
    <use href="#gbOuter" transform="rotate(320 60 60)"/>
    <use href="#gbOuter" transform="rotate(328 60 60)"/>
    <use href="#gbOuter" transform="rotate(336 60 60)"/>
    <use href="#gbOuter" transform="rotate(344 60 60)"/>
    <use href="#gbOuter" transform="rotate(352 60 60)"/>
  </g>

</svg>
