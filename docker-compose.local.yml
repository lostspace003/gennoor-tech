version: '3.8'

services:
  # PostgreSQL with pgvector for local development
  postgres-local:
    image: pgvector/pgvector:pg16
    container_name: gennoor-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gennoor_leads
    volumes:
      - ./init-scripts/init-vector.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_local_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching
  redis-local:
    image: redis:7-alpine
    container_name: gennoor-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data

  # Adminer for database management (optional)
  adminer:
    image: adminer
    container_name: gennoor-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-local

volumes:
  postgres_local_data:
  redis_local_data: