version: '3.8'

services:
  # PostgreSQL with pgvector for embeddings
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: gennoor-postgres-vector
    environment:
      POSTGRES_USER: gennoor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gennoor2024}
      POSTGRES_DB: leads_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init-vector.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - gennoor-network
    restart: unless-stopped

  # Qdrant Vector Database (Alternative to pgvector, more specialized)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gennoor-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - gennoor-network
    restart: unless-stopped

  # Embedding Service using Sentence Transformers
  embedding-service:
    build:
      context: ./services/embedding
      dockerfile: Dockerfile
    container_name: gennoor-embedding
    environment:
      MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
      CACHE_DIR: "/models"
      API_KEY: ${EMBEDDING_API_KEY:-gennoor-embed-2024}
    volumes:
      - model_cache:/models
      - ./services/embedding:/app
    ports:
      - "8001:8001"
    networks:
      - gennoor-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # LLM Service using Ollama for local inference
  ollama:
    image: ollama/ollama:latest
    container_name: gennoor-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - gennoor-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    command: serve

  # Indexing Service (Runs weekly)
  indexer:
    build:
      context: ./services/indexer
      dockerfile: Dockerfile
    container_name: gennoor-indexer
    environment:
      POSTGRES_URI: postgresql://gennoor:${POSTGRES_PASSWORD:-gennoor2024}@postgres-vector:5432/leads_db
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SERVICE_URL: http://embedding-service:8001
      SCHEDULE: "0 7 * * 6"  # Every Saturday at 7 AM IST
      TZ: "Asia/Kolkata"
    depends_on:
      - postgres-vector
      - qdrant
      - embedding-service
    networks:
      - gennoor-network
    restart: unless-stopped

  # RAG API Service
  rag-api:
    build:
      context: ./services/rag-api
      dockerfile: Dockerfile
    container_name: gennoor-rag-api
    environment:
      POSTGRES_URI: postgresql://gennoor:${POSTGRES_PASSWORD:-gennoor2024}@postgres-vector:5432/leads_db
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SERVICE_URL: http://embedding-service:8001
      OLLAMA_URL: http://ollama:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USE_LOCAL_LLM: ${USE_LOCAL_LLM:-true}
      JWT_SECRET: ${JWT_SECRET:-gennoor-jwt-secret-2024}
    ports:
      - "8002:8002"
    depends_on:
      - postgres-vector
      - qdrant
      - embedding-service
      - ollama
    networks:
      - gennoor-network
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: gennoor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gennoor-network
    restart: unless-stopped

  # MinIO for document storage
  minio:
    image: minio/minio:latest
    container_name: gennoor-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gennoor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gennoor2024}
    command: server /data --console-address ":9001"
    networks:
      - gennoor-network
    restart: unless-stopped

networks:
  gennoor-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
  ollama_data:
  redis_data:
  minio_data: