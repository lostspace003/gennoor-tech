<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="380" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">GennoorBot / GennoorCare — launcher avatar samples</text>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <!-- Brand ring, original geometry (viewBox 130) -->
    <g id="ring">
      <circle cx="105.8" cy="84" r="6"/><circle cx="93.4" cy="99.9" r="6"/><circle cx="75.4" cy="108.8" r="6"/>
      <circle cx="55.3" cy="108.9" r="6"/><circle cx="37.1" cy="100.3" r="6"/><circle cx="24.5" cy="84.6" r="6"/>
      <circle cx="20" cy="65" r="6"/><circle cx="24.5" cy="45.4" r="6"/><circle cx="37.1" cy="29.7" r="6"/>
      <circle cx="55.3" cy="21.1" r="6"/><circle cx="75.4" cy="21.2" r="6"/><circle cx="93.4" cy="30.1" r="6"/>
    </g>
    <g id="trail">
      <circle cx="80" cy="65" r="6"/><circle cx="95" cy="65" r="6"/><circle cx="110" cy="65" r="6"/>
    </g>
  </defs>

  <!-- ========== A: Gradient orb ========== -->
  <g transform="translate(80,90)">
    <circle cx="80" cy="80" r="78" fill="url(#grad)" filter="url(#soft)"/>
    <g transform="translate(28,28) scale(0.8)">
      <use href="#ring" fill="#ffffff" opacity="0.95"/>
      <use href="#trail" fill="#F59E0B"/>
    </g>
    <!-- presence light -->
    <circle cx="138" cy="26" r="13" fill="#22c55e" stroke="#ffffff" stroke-width="4"/>
    <text x="80" y="205" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">A · Gradient orb</text>
    <text x="80" y="228" text-anchor="middle" font-size="13" fill="#64748b">white ring, amber trail, presence dot</text>
  </g>

  <!-- ========== B: White badge (original colors) ========== -->
  <g transform="translate(400,90)">
    <circle cx="80" cy="80" r="78" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#soft)"/>
    <g transform="translate(28,28) scale(0.8)">
      <use href="#ring" fill="#2563EB"/>
      <use href="#trail" fill="#F59E0B"/>
    </g>
    <circle cx="138" cy="26" r="13" fill="#22c55e" stroke="#ffffff" stroke-width="4"/>
    <text x="80" y="205" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">B · White badge</text>
    <text x="80" y="228" text-anchor="middle" font-size="13" fill="#64748b">original brand colors, clean on any page</text>
  </g>

  <!-- ========== C: Chat bubble ========== -->
  <g transform="translate(720,90)">
    <path d="M 80 2 a 78 78 0 1 1 -0.01 0 Z M 26 138 l -18 26 l 34 -12 Z" fill="url(#grad)" filter="url(#soft)"/>
    <circle cx="80" cy="80" r="78" fill="url(#grad)"/>
    <path d="M 24 136 L 4 166 L 44 152 Z" fill="url(#grad)"/>
    <g transform="translate(28,24) scale(0.8)">
      <use href="#ring" fill="#ffffff" opacity="0.95"/>
    </g>
    <!-- typing dots as the trail, centered -->
    <g fill="#F59E0B">
      <circle cx="56" cy="80" r="7"/>
      <circle cx="80" cy="80" r="7" opacity="0.85"/>
      <circle cx="104" cy="80" r="7" opacity="0.7"/>
    </g>
    <circle cx="138" cy="26" r="13" fill="#22c55e" stroke="#ffffff" stroke-width="4"/>
    <text x="80" y="205" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">C · Chat bubble</text>
    <text x="80" y="228" text-anchor="middle" font-size="13" fill="#64748b">bubble tail + typing dots — clearly a chat</text>
  </g>

  <!-- ========== D: Sober navy premium ========== -->
  <g transform="translate(1040,90)">
    <defs>
      <radialGradient id="navy" cx="0.35" cy="0.3" r="1">
        <stop offset="0" stop-color="#1b2a4a"/>
        <stop offset="1" stop-color="#0C1426"/>
      </radialGradient>
    </defs>
    <!-- subtle halo ring = the 'flash' -->
    <circle cx="80" cy="80" r="86" fill="none" stroke="#2563EB" stroke-opacity="0.25" stroke-width="3"/>
    <circle cx="80" cy="80" r="78" fill="url(#navy)" filter="url(#soft)"/>
    <g transform="translate(28,28) scale(0.8)">
      <use href="#ring" fill="#93b4ff"/>
      <use href="#trail" fill="#F59E0B"/>
    </g>
    <circle cx="138" cy="26" r="13" fill="#22c55e" stroke="#0C1426" stroke-width="4"/>
    <text x="80" y="205" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">D · Navy premium</text>
    <text x="80" y="228" text-anchor="middle" font-size="13" fill="#64748b">sober brand navy, soft-blue ring, subtle halo</text>
  </g>

  <text x="640" y="350" text-anchor="middle" font-size="14" fill="#64748b">All pure SVG (crisp at any size) · same asset for GennoorCare (site) and GennoorBot (CRM) · green light = online · in-app the halo/presence dot gets a gentle pulse animation</text>
</svg>
